setup: ./setup.bash
run: ./run.bash {algorithm} {preset} {file}

designs:
  smoke:
    factors:
      file: [sample.txt]
      algorithm: [gzip, zstd]
      preset: [default]

  full:
    factors:
      file: [sample.pb, sample.png, sample.txt]
      algorithm: [gzip, zstd]
      preset: [min, default, max]
    replicates: 6
